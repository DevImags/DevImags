<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Kanban de Controle Agrícola</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <link rel="icon" type="image/svg+xml" href="../assets/sigla/favicon.svg">
    <link rel="shortcut icon" href="../assets/sigla/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/sigla/apple-touch-icon.png">
    
    <link rel="stylesheet" href="../css/controle_tratos.css">
</head>

<body>

    <div class="header-card">
        <a href="../index.html">HOME</a>
        <h1>🚜 Operações Agrícolas</h1>
        <button id="btn-pdf" class="btn-exportar">📄 Exportar PDF</button>

        <div class="ciclo-selector">
            <button id="btn-cana-planta" class="btn-ciclo active">🌱 Cana Planta</button>
            <button id="btn-cana-soca" class="btn-ciclo">🪵 Cana Soca</button>
        </div>

        <div id="drop-zone" onclick="document.getElementById('upload-excel').click();">
            <span>📁 Carregar Planilha</span>
            <input type="file" id="upload-excel" accept=".xlsx, .xls" style="display: none;" />
        </div>
    </div>

    <div class="kanban-wrapper">

        <aside id="card-filtros" class="sidebar-filtros">
            <h3 class="sidebar-title">📍 Filtrar Fazendas</h3>
            <div class="sidebar-actions">
                <button id="btn-marcar-todos" type="button" class="btn-filter">☑️ Marcar Todas</button>
                <button id="btn-desmarcar-todos" type="button" class="btn-filter">⬜ Limpar</button>
            </div>
            <div id="lista-propriedades-filtros" class="filter-list">
                <p class="filter-placeholder">Aguardando planilha...</p>
            </div>

            <h3 class="sidebar-title">⚙️ Filtrar Operações</h3>
            <div class="sidebar-actions">
                <button id="btn-marcar-ops" type="button" class="btn-filter">☑️ Ver Todas</button>
                <button id="btn-desmarcar-ops" type="button" class="btn-filter">⬜ Limpar</button>
            </div>
            <div id="lista-operacoes-filtros" class="filter-list">
                <p class="filter-placeholder">Aguardando planilha...</p>
            </div>
        </aside>

        <div class="container">
            <div class="column">
                <h2 class="not-planted-title">
                    🌱 Sem Plantio
                </h2>
                <div id="col-sem-plantio"></div>
            </div>

            <div id="bloco-reforma" class="column" style="display: none;">
                <h2 id="titulo-reforma" class="reforma-title">
                    🚜 Em Reforma
                </h2>
                <div id="col-reforma"></div>
            </div>

            <div class="column">
                <h2 id="titulo-pendentes" class="pending-title">⏳ Planejado</h2>
                <div id="col-pendentes"></div>
            </div>

            <div class="column">
                <h2 id="titulo-andamento" class="progress-title">⚙️ O.S. Liberada</h2>
                <div id="col-andamento"></div>
            </div>

            <div class="column">
                <h2 id="titulo-realizadas" class="success-title">✅ Realizadas</h2>
                <div id="col-realizadas"></div>
            </div>
        </div>

    </div>

    <div id="preview-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; box-sizing: border-box;">
        <div
            style="background: #222; width: 95vw; height: 95vh; border-radius: 8px; display: flex; flex-direction: column; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.7);">

            <div
                style="padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; background: #1a1a1a; border-top-left-radius: 8px; border-top-right-radius: 8px;">
                <h3 style="margin: 0; color: #fff; font-size: 15px; font-weight: 600;">📋 Pré-visualização de Impressão
                    (Folha A4 Paisagem)</h3>
                <div style="display: flex; gap: 10px;">
                    <button id="btn-modal-confirmar"
                        style="background: #4CAF50; color: white; border: none; padding: 8px 18px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; transition: background 0.2s;">🖨️
                        Imprimir / Salvar PDF</button>
                    <button id="btn-modal-fechar"
                        style="background: #444; color: #eee; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;">Fechar</button>
                </div>
            </div>

            <div
                style="flex: 1; overflow: auto; padding: 30px; background: #121212; display: flex; justify-content: center; align-items: flex-start;">

                <div id="preview-content-area"
                    style="background: #121212; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); padding: 15px; box-sizing: border-box; transform-origin: top center;">
                </div>

            </div>
        </div>
    </div>

    <script src="../js/controle_tratos.js"></script>
</body>

</html>
